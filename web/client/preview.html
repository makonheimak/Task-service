<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task UI Preview (no server)</title>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#111827; background:#f8fafc; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      section { max-width: 720px; margin: 48px auto; padding: 24px; background: white; border-radius: 12px; border: 1px solid #e5e7eb; }
      h1 { margin-top: 0; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display:flex; justify-content:space-between; gap: 12px; padding: 10px 0; border-bottom:1px solid #f1f5f9; }
      li:last-child { border-bottom: 0; }
      small { color:#6b7280; }
      .badge { display:inline-block; margin-left:8px; font-size:12px; padding:2px 8px; border-radius:999px; }
      .done { background:#dcfce7; color:#166534; }
      .open { background:#fef9c3; color:#854d0e; }
      .hint { margin-top: 16px; color:#475569; }
      code { background:#f1f5f9; border-radius:6px; padding:2px 6px; }
    </style>
  </head>
  <body>
    <section>
      <h1>Tasks (offline preview)</h1>
      <ul id="task-list"></ul>
      <p class="hint">
        Это офлайн-превью без Vue/Laravel/Go. Для полноценного приложения используйте
        <code>npm run dev</code> в <code>web/client</code>.
      </p>
    </section>

    <script>
      const tasks = [
        { id: 1, task: 'Сверстать экран задач', user_id: 1001, is_done: false },
        { id: 2, task: 'Подключить API', user_id: 1001, is_done: true },
        { id: 3, task: 'Добавить фильтры', user_id: 1002, is_done: false }
      ];

      const list = document.getElementById('task-list');
      tasks.forEach((task) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>
            ${task.task}
            <span class="badge ${task.is_done ? 'done' : 'open'}">${task.is_done ? 'done' : 'open'}</span>
          </span>
          <small>#${task.id} • user: ${task.user_id}</small>
        `;
        list.appendChild(li);
      });
    </script>
  </body>
</html>
